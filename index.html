<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>EA稼働確認ダッシュボード</title>
<style>
  :root {
    --bg: #0f1419; --card: #1a2028; --border: #2a3441;
    --text: #e6edf3; --muted: #8b98a5;
    --ok: #3fb950; --watch: #d29922; --warn: #f0883e; --alert: #f85149;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text);
         font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
         padding: 20px; font-size: 14px; }
  h1 { font-size: 18px; margin-bottom: 4px; }
  .meta { color: var(--muted); font-size: 12px; margin-bottom: 16px; }
  .counts { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
  .count { background: var(--card); border: 1px solid var(--border);
           border-radius: 8px; padding: 10px 16px; min-width: 90px; }
  .count .n { font-size: 22px; font-weight: 700; }
  .count .l { font-size: 11px; color: var(--muted); }
  .count.ALERT .n { color: var(--alert); }
  .count.WARN .n { color: var(--warn); }
  .count.WATCH .n { color: var(--watch); }
  .count.OK .n { color: var(--ok); }
  table { width: 100%; border-collapse: collapse; background: var(--card);
          border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border);
           font-size: 13px; white-space: nowrap; }
  th { background: #141a21; color: var(--muted); font-weight: 600; font-size: 11px;
       text-transform: uppercase; letter-spacing: .04em; position: sticky; top: 0; }
  td.reasons { white-space: normal; min-width: 220px; color: var(--muted); }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px;
           font-size: 11px; font-weight: 700; }
  .badge.ALERT { background: rgba(248,81,73,.15); color: var(--alert); }
  .badge.WARN  { background: rgba(240,136,62,.15); color: var(--warn); }
  .badge.WATCH { background: rgba(210,153,34,.15); color: var(--watch); }
  .badge.OK    { background: rgba(63,185,80,.12); color: var(--ok); }
  .badge.STOPPED { background: rgba(139,152,165,.15); color: var(--muted); }
  .badge.RETIRED { background: rgba(139,152,165,.10); color: #5c6773; }
  .count.STOPPED .n, .count.RETIRED .n { color: var(--muted); }
  /* 浮動DD%の色バンド */
  .dd-blue   { color: #58a6ff; }  /* -1.00以下（含み益方向） */
  .dd-white  { color: var(--text); } /* -0.99〜4.99（平常） */
  .dd-yellow { color: #d29922; }  /* 5.00〜9.99（要監視） */
  .dd-red    { color: #f85149; }  /* 10.00以上（警戒） */
  .legend { color: var(--muted); font-size: 12px; margin: 10px 0 16px; }
  .legend span { margin-right: 14px; white-space: nowrap; }
  .toggle-btn { background: var(--card); border: 1px solid var(--border);
    color: var(--muted); border-radius: 8px; padding: 8px 14px; font-size: 13px;
    cursor: pointer; margin: 18px 0 8px; }
  .toggle-btn:hover { color: var(--text); }
  tr.excluded-row { display: none; opacity: .55; }
  body.show-excluded tr.excluded-row { display: table-row; }
  .badge.EXCLUDED { background: rgba(139,152,165,.12); color: var(--muted); }
  .count.EXCLUDED .n { color: var(--muted); }
  .demo { color: var(--muted); font-size: 11px; }
  .err { background: rgba(248,81,73,.1); border: 1px solid var(--alert);
         border-radius: 8px; padding: 10px 14px; margin-bottom: 14px; }
  .tablewrap { overflow-x: auto; }
  @media (max-width: 700px) { body { padding: 10px; } }
</style>
</head>
<body>
<h1>EA稼働確認ダッシュボード</h1>
<div class="meta" id="meta">読み込み中…</div>
<div class="meta" id="dispCount"></div>
<div id="loginErrors"></div>
<div class="counts" id="counts"></div>
<div class="legend">
  発生DD率の文字色:
  <span class="dd-blue">■ 青 = −1.00以下（含み益方向）</span>
  <span class="dd-white">■ 白 = −0.99〜4.99（平常）</span>
  <span class="dd-yellow">■ 黄 = 5.00〜9.99（要監視）</span>
  <span class="dd-red">■ 赤 = 10.00以上（警戒）</span>
</div>
<button class="toggle-btn" id="toggleExcluded" style="display:none"></button>
<div class="tablewrap">
<table>
  <thead><tr>
    <th>状態</th><th>口座名</th><th>MFBログイン</th>
    <th>最終更新</th><th>MFB更新停止(h)</th><th>最終取引(日)</th>
    <th>ポジション保有数</th><th>発生DD率</th><th>理由</th>
  </tr></thead>
  <tbody id="rows"></tbody>
</table>
</div>
<script>
function ddClass(v) {
  if (v >= 10.0) return 'dd-red';     // 10.00〜
  if (v >= 5.0)  return 'dd-yellow';  // 5.00〜9.99
  if (v <= -1.0) return 'dd-blue';    // -1.00以下
  return 'dd-white';                  // -0.99〜4.99
}
fetch('./data/status.json?t=' + Date.now())
  .then(r => r.json())
  .then(d => {
    document.getElementById('meta').textContent =
      '生成: ' + d.generated_at_jst + ' ／ 対象口座: ' + d.total_accounts;
    const cc = document.getElementById('counts');
    for (const lv of ['ALERT','WARN','WATCH','OK','STOPPED','EXCLUDED','RETIRED']) {
      cc.insertAdjacentHTML('beforeend',
        `<div class="count ${lv}"><div class="n">${d.counts[lv] ?? 0}</div><div class="l">${lv}</div></div>`);
    }
    if (d.login_errors && d.login_errors.length) {
      document.getElementById('loginErrors').innerHTML =
        '<div class="err"><b>ログイン失敗:</b> ' +
        d.login_errors.map(e => `${e.myfxbook_login}（${e.error}）`).join(' / ') + '</div>';
    }
    const hiddenLevels = ['STOPPED', 'EXCLUDED', 'RETIRED'];
    const hiddenCount = d.accounts.filter(a => hiddenLevels.includes(a.level)).length;
    const activeCount = d.total_accounts - hiddenCount;
    const btn = document.getElementById('toggleExcluded');
    const disp = document.getElementById('dispCount');
    const refresh = () => {
      const shown = document.body.classList.contains('show-excluded');
      const visible = shown ? d.total_accounts : activeCount;
      disp.textContent = `一覧に掲載中: ${visible}口座（監視対象 ${activeCount}` +
        (shown ? ` ＋ 監視除外・長期停止 ${hiddenCount}` : ``) + `） ／ 全${d.total_accounts}口座`;
      btn.textContent = shown
        ? `監視除外・長期停止リストを隠す（${hiddenCount}口座を非表示にする）`
        : `監視除外・長期停止リストを表示（${hiddenCount}口座を追加表示する）`;
    };
    if (hiddenCount > 0) {
      btn.style.display = 'inline-block';
      btn.onclick = () => { document.body.classList.toggle('show-excluded'); refresh(); };
    }
    refresh();
    const tb = document.getElementById('rows');
    for (const a of d.accounts) {
      tb.insertAdjacentHTML('beforeend', `<tr class="${hiddenLevels.includes(a.level) ? 'excluded-row' : ''}">
        <td><span class="badge ${a.level}">${a.level}</span></td>
        <td>${a.name ?? ''}${a.demo ? ' <span class="demo">demo</span>' : ''}</td>
        <td>${a.myfxbook_login}</td>
        <td>${a.last_update ?? ''}</td>
        <td>${a.hours_since_update ?? ''}</td>
        <td>${a.days_since_trade ?? ''}</td>
        <td>${a.open_trades_count}</td>
        <td>${a.float_dd_pct == null ? '' :
             `<span class="${ddClass(a.float_dd_pct)}">${a.float_dd_pct}</span>`}</td>
        <td class="reasons">${(a.reasons || []).join('<br>')}</td>
      </tr>`);
    }
  })
  .catch(e => {
    document.getElementById('meta').textContent =
      'status.json の読み込みに失敗しました（初回実行前の可能性）: ' + e;
  });
</script>
</body>
</html>
