<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>EA稼働確認ダッシュボード</title>
<style>
  :root {
    --bg: #0f1419; --card: #1a2028; --border: #2a3441;
    --text: #e6edf3; --muted: #8b98a5;
    --ok: #3fb950; --watch: #d29922; --warn: #f0883e; --alert: #f85149;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text);
         font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
         padding: 20px; font-size: 14px; }
  h1 { font-size: 18px; margin-bottom: 4px; }
  .meta { color: var(--muted); font-size: 12px; margin-bottom: 16px; }
  .counts { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
  .count { background: var(--card); border: 1px solid var(--border);
           border-radius: 8px; padding: 10px 16px; min-width: 90px; }
  .count .n { font-size: 22px; font-weight: 700; }
  .count .l { font-size: 11px; color: var(--muted); }
  .count.ALERT .n { color: var(--alert); }
  .count.WARN .n { color: var(--warn); }
  .count.WATCH .n { color: var(--watch); }
  .count.OK .n { color: var(--ok); }
  table { width: 100%; border-collapse: collapse; background: var(--card);
          border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border);
           font-size: 13px; white-space: nowrap; }
  th { background: #141a21; color: var(--muted); font-weight: 600; font-size: 11px;
       text-transform: uppercase; letter-spacing: .04em; position: sticky; top: 0; }
  td.reasons { white-space: normal; min-width: 220px; color: var(--muted); }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px;
           font-size: 11px; font-weight: 700; }
  .badge.ALERT { background: rgba(248,81,73,.15); color: var(--alert); }
  .badge.WARN  { background: rgba(240,136,62,.15); color: var(--warn); }
  .badge.WATCH { background: rgba(210,153,34,.15); color: var(--watch); }
  .badge.OK    { background: rgba(63,185,80,.12); color: var(--ok); }
  .badge.STOPPED { background: rgba(139,152,165,.15); color: var(--muted); }
  .badge.RETIRED { background: rgba(139,152,165,.10); color: #5c6773; }
  .count.STOPPED .n, .count.RETIRED .n { color: var(--muted); }
  /* 浮動DD%の色バンド */
  .dd-blue   { color: #58a6ff; }  /* -1.00以下（含み益方向） */
  .dd-white  { color: var(--text); } /* -0.99〜4.99（平常） */
  .dd-yellow { color: #d29922; }  /* 5.00〜9.99（要監視） */
  .dd-red    { color: #f85149; }  /* 10.00以上（警戒） */
  .legend { color: var(--muted); font-size: 12px; margin: 10px 0 16px; }
  .legend span { margin-right: 14px; white-space: nowrap; }
  .toggle-btn { background: var(--card); border: 1px solid var(--border);
    color: var(--muted); border-radius: 8px; padding: 8px 14px; font-size: 13px;
    cursor: pointer; margin: 18px 0 8px; }
  .toggle-btn:hover { color: var(--text); }
  /* 表示・非表示の制御はJS(refresh)が担当。CSSは見た目のみ */
  tr.excluded-row { opacity: .55; }
  .badge.EXCLUDED { background: rgba(139,152,165,.12); color: var(--muted); }
  .count.EXCLUDED .n { color: var(--muted); }
  .demo { color: var(--muted); font-size: 11px; }
  .err { background: rgba(248,81,73,.1); border: 1px solid var(--alert);
         border-radius: 8px; padding: 10px 14px; margin-bottom: 14px; }
  .criteria { background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 16px; margin-bottom: 16px; font-size: 12.5px; color: var(--muted); }
  .criteria .criteria-title { color: var(--text); font-weight: 600; font-size: 13px; margin-bottom: 8px; }
  .criteria ul { list-style: none; margin: 0; padding: 0; }
  .criteria li { padding: 3px 0; border-bottom: 1px dashed var(--border); }
  .criteria li:last-child { border-bottom: none; }
  .criteria b { color: var(--text); font-weight: 600; }
  .cat { display: inline-block; padding: 2px 8px; border-radius: 4px;
         font-size: 11px; font-weight: 700; letter-spacing: .03em; }
  .cat-EA   { background: rgba(88,166,255,.15); color: #58a6ff; }
  .cat-PAMM { background: rgba(210,153,34,.18); color: #d29922; }
  .filters { display: flex; gap: 8px; margin: 14px 0 4px; flex-wrap: wrap; }
  .filter-btn { background: var(--card); border: 1px solid var(--border);
    color: var(--muted); border-radius: 8px; padding: 6px 14px; font-size: 13px;
    cursor: pointer; }
  .filter-btn:hover { color: var(--text); }
  .filter-btn.active { border-color: #58a6ff; color: var(--text); }
  .tablewrap { overflow-x: auto; }
  @media (max-width: 700px) { body { padding: 10px; } }
</style>
</head>
<body>
<h1>EA稼働確認ダッシュボード</h1>
<div class="meta" id="meta">読み込み中…</div>
<div class="meta" id="dispCount"></div>
<div id="loginErrors"></div>
<div class="counts" id="counts"></div>
<div class="criteria">
  <div class="criteria-title">判定基準（現在適用中の設定値）</div>
  <ul id="criteriaList"><li>読み込み中…</li></ul>
</div>
<div class="filters" id="catFilters"></div>
<button class="toggle-btn" id="toggleExcluded" style="display:none"></button>
<div class="tablewrap">
<table>
  <thead><tr>
    <th>状態</th><th>区分</th><th>口座名</th><th>口座番号</th><th>MFBログイン</th>
    <th>最終更新</th><th>MFB更新停止(h)</th><th>最終取引(日)</th>
    <th>ポジション保有数</th><th>発生DD率</th><th>理由</th>
  </tr></thead>
  <tbody id="rows"></tbody>
</table>
</div>
<script>
// 前回の開閉状態を復元（このブラウザのみで記憶。他端末とは共有されない）
try {
  if (localStorage.getItem('ea-check-show-excluded') === '1') {
    document.body.classList.add('show-excluded');
  }
} catch (e) { /* localStorage無効環境は無視 */ }

function ddClass(v) {
  if (v >= 10.0) return 'dd-red';     // 10.00〜
  if (v >= 5.0)  return 'dd-yellow';  // 5.00〜9.99
  if (v <= -1.0) return 'dd-blue';    // -1.00以下
  return 'dd-white';                  // -0.99〜4.99
}
fetch('./data/status.json?t=' + Date.now())
  .then(r => r.json())
  .then(d => {
    document.getElementById('meta').textContent =
      '生成: ' + d.generated_at_jst + ' ／ 対象口座: ' + d.total_accounts;
    const cc = document.getElementById('counts');
    for (const lv of ['ALERT','WARN','WATCH','OK','STOPPED','EXCLUDED','RETIRED']) {
      cc.insertAdjacentHTML('beforeend',
        `<div class="count ${lv}"><div class="n">${d.counts[lv] ?? 0}</div><div class="l">${lv}</div></div>`);
    }
    const th = d.thresholds || {};
    const crit = document.getElementById('criteriaList');
    const critItems = [
      `<b>MFB更新停止</b>: WARN ${th.update_stale_warn_hours ?? '?'}時間以上 ／ ` +
        `ALERT ${th.update_stale_alert_hours ?? '?'}時間以上 ／ ` +
        `長期停止(STOPPED) ${th.update_stopped_days ?? '?'}日以上`,
      `<b>最終取引からの経過</b>: WATCH ${th.no_trade_watch_days ?? '?'}日以上 ／ ` +
        `WARN ${th.no_trade_alert_days ?? '?'}日以上`,
      `<b>ポジション構成不変</b>: WATCH ${th.positions_unchanged_watch_days ?? '?'}日以上`,
      `<b>発生DD率（総合判定）</b>: WARN 残高比${th.floating_dd_warn_pct ?? '?'}%以上`,
      `<b>発生DD率（文字色の目安・表示のみ）</b>: ` +
        `<span class="dd-blue">青 −1.00以下</span> ／ ` +
        `<span class="dd-white">白 −0.99〜4.99</span> ／ ` +
        `<span class="dd-yellow">黄 5.00〜9.99</span> ／ ` +
        `<span class="dd-red">赤 10.00以上</span>`,
    ];
    crit.innerHTML = critItems.map(t => `<li>${t}</li>`).join('');

    if (d.login_errors && d.login_errors.length) {
      document.getElementById('loginErrors').innerHTML =
        '<div class="err"><b>ログイン失敗:</b> ' +
        d.login_errors.map(e => `${e.myfxbook_login}（${e.error}）`).join(' / ') + '</div>';
    }
    const hiddenLevels = ['STOPPED', 'EXCLUDED', 'RETIRED'];
    const hiddenCount = d.accounts.filter(a => hiddenLevels.includes(a.level)).length;
    const activeCount = d.total_accounts - hiddenCount;
    const btn = document.getElementById('toggleExcluded');
    const disp = document.getElementById('dispCount');
    // 区分フィルタ（'ALL' または 'EA'/'PAMM' 等）
    let catFilter = 'ALL';
    try { catFilter = localStorage.getItem('ea-check-cat') || 'ALL'; } catch (e) {}
    const cats = [...new Set(d.accounts.map(a => a.category ?? 'EA'))].sort();
    if (!['ALL', ...cats].includes(catFilter)) catFilter = 'ALL';

    const refresh = () => {
      const shown = document.body.classList.contains('show-excluded');
      // 実際に表示される行だけを数える（区分フィルタと除外トグルの両方を考慮）
      let visible = 0, visibleActive = 0;
      for (const tr of document.querySelectorAll('#rows tr')) {
        const isHidden = tr.classList.contains('excluded-row');
        const rowCat = tr.dataset.cat || 'EA';
        const catOk = (catFilter === 'ALL') || (rowCat === catFilter);
        const show = catOk && (shown || !isHidden);
        tr.style.display = show ? '' : 'none';
        if (show) { visible++; if (!isHidden) visibleActive++; }
      }
      const scope = (catFilter === 'ALL') ? '' : `［${catFilter}のみ］`;
      disp.textContent = `一覧に掲載中: ${visible}口座${scope}` +
        (shown ? `（うち監視対象 ${visibleActive}）` : ``) + ` ／ 全${d.total_accounts}口座`;
      btn.textContent = shown
        ? `監視除外・長期停止リストを隠す（現在の表示: ${visible}口座）`
        : `監視除外・長期停止リストを表示（現在の表示: ${visible}口座）`;
      for (const b of document.querySelectorAll('.filter-btn')) {
        b.classList.toggle('active', b.dataset.cat === catFilter);
      }
    };

    // 区分が2種類以上あるときだけフィルタボタンを表示
    if (cats.length > 1) {
      const fw = document.getElementById('catFilters');
      fw.innerHTML = ['ALL', ...cats].map(c => {
        const n = c === 'ALL' ? d.total_accounts
                              : d.accounts.filter(a => (a.category ?? 'EA') === c).length;
        const label = c === 'ALL' ? '全区分' : c;
        return `<button class="filter-btn" data-cat="${c}">${label}（${n}）</button>`;
      }).join('');
      for (const b of fw.querySelectorAll('.filter-btn')) {
        b.onclick = () => {
          catFilter = b.dataset.cat;
          try { localStorage.setItem('ea-check-cat', catFilter); } catch (e) {}
          refresh();
        };
      }
    }
    if (hiddenCount > 0) {
      btn.style.display = 'inline-block';
      btn.onclick = () => {
        document.body.classList.toggle('show-excluded');
        try {
          localStorage.setItem('ea-check-show-excluded',
            document.body.classList.contains('show-excluded') ? '1' : '0');
        } catch (e) { /* 無視 */ }
        refresh();
      };
    }
    const tb = document.getElementById('rows');
    for (const a of d.accounts) {
      tb.insertAdjacentHTML('beforeend', `<tr data-cat="${a.category ?? 'EA'}" class="${hiddenLevels.includes(a.level) ? 'excluded-row' : ''}">
        <td><span class="badge ${a.level}">${a.level}</span></td>
        <td><span class="cat cat-${(a.category ?? 'EA').replace(/[^A-Za-z0-9]/g,'')}">${a.category ?? 'EA'}</span></td>
        <td>${a.name ?? ''}${a.demo ? ' <span class="demo">demo</span>' : ''}</td>
        <td>${a.account_id_masked ?? ''}</td>
        <td>${a.myfxbook_login}</td>
        <td>${a.last_update ?? ''}</td>
        <td>${a.hours_since_update ?? ''}</td>
        <td>${a.days_since_trade ?? ''}</td>
        <td>${a.open_trades_count}</td>
        <td>${a.float_dd_pct == null ? '' :
             `<span class="${ddClass(a.float_dd_pct)}">${a.float_dd_pct}</span>`}</td>
        <td class="reasons">${(a.reasons || []).join('<br>')}</td>
      </tr>`);
    }
    // 全行を生成し終えてから表示制御を実行する（行が無い状態で呼ぶと0件になる）
    refresh();
  })
  .catch(e => {
    document.getElementById('meta').textContent =
      'status.json の読み込みに失敗しました（初回実行前の可能性）: ' + e;
  });
</script>
</body>
</html>
