# 運用終了口座リスト
# ここに記載した口座は RETIRED として監視対象外（一覧の最下部に表示のみ）になる。
# 口座名はMyfxbook上の表示名（ダッシュボードの「口座名」列）と完全一致で記載する。
#
# 使い方: 下の candidates から運用終了が確定しているものを retired: の下に移す
# （行頭の「# 」を外してインデントを合わせるだけ）。
#
# 注意: STOPPED（30日以上更新なし）は自動分類されるため、ここに書かなくても
# ALERTを鳴らし続けることはない。ここは「意図して終了した」ことの記録として使う。

retired: []

# 監視除外リスト
# ここに記載した口座は EXCLUDED として判定・集計から外れ、
# ダッシュボードでは「監視除外リスト」トグルを開いたときのみ表示される。
# （削除ではないので、リストから名前を消せばいつでも監視に復帰する）
# 口座名はダッシュボードの「口座名」列と完全一致で記載する。
#
# 記入例:
# excluded:
#   - "BS300"
#   - "Two-ways"
excluded:
  - "AMA-40JY"
  - "FECA.co.ltd #60"
  - "Gold Gate"
  - "Hybrid-MOON"
  - "IDEAL-Half"
  - "KI1996"
  - "NEW Trade2504"
  - "OG-Lush"
  - "PopinTrade"
  - "HHD-3521"
  - "BTC-Trade"
  - "Cherry-GL"
  - "FireBird"

