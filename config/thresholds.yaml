# EA-check-account 判定閾値
# 運用しながら調整する。変更履歴はコミットログで管理。

# 1) Myfxbook更新停止（接続断・ターミナル停止疑い）
update_stale_warn_hours: 24     # 24時間以上更新なし → WARN
update_stale_alert_hours: 48    # 48時間以上更新なし → ALERT
# 注意: 週末はブローカー停止で更新が止まるのが正常。
#       実行スケジュール側で土日を除外している（check.yml参照）。

# 2) 無取引期間（EA停止疑い）
#    初期値は固定日数。運用データが溜まったらEA別95パーセンタイルに移行予定。
no_trade_watch_days: 7          # 7日以上取引アクティビティなし → WATCH
no_trade_alert_days: 14         # 14日以上 → WARN

# 3) オープンポジション構成の長期不変（グリッド系EAの異常シグナル）
positions_unchanged_watch_days: 7

# 4) 浮動DD（残高比、balance-equity乖離）
floating_dd_warn_pct: 10.0

# API負荷対策
per_account_sleep_sec: 2
per_login_sleep_sec: 3

# 5) 長期停止の自動分離
#    これを超える更新停止はALERTでなくSTOPPED（長期停止）に分類し、
#    直近の異変（ALERT/WARN）と区別する
update_stopped_days: 30

# 6) 口座区分ラベル（案A: 表示のみ。判定基準は現状すべて共通）
#    キーは MYFXBOOK_CREDENTIALS のアカウント名（investar1 等）と完全一致させる。
#    ここに記載がないアカウントは default_category の値が使われる。
#    将来、区分ごとに判定基準を変える改修（案B）を行う場合も、この対応表を流用する。
default_category: "EA"
categories: {}
  # 例: PAMM管理口座を追加する場合は、上の {} を消してこのように記載する
  #   pamm1: "PAMM"
  #   pamm2: "PAMM"
